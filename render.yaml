# Render blueprint for the Compass API.
#
# Deploy:
#   1. Push this branch to GitHub.
#   2. In Render: New -> Blueprint -> select this repository and branch.
#   3. Render creates the web service and a PostgreSQL database, and wires
#      DATABASE_URL automatically.
#   4. Set the secrets marked sync:false in the dashboard (see README).
#
# Note: the free instance type sleeps after ~15 minutes idle, so the first
# request after a pause takes several seconds. Upgrade the plan if that
# matters for your users.

services:
  - type: web
    name: compass-api
    runtime: node
    plan: free
    branch: compass-0.0.6
    # devDependencies are needed at build time; tsx is a runtime dependency.
    buildCommand: npm ci
    startCommand: npm run server:start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Required: lets the API verify Clerk session tokens. Secret - never
      # expose this to the client.
      - key: CLERK_SECRET_KEY
        sync: false
      # Optional: enables live search, nearby discovery and place photos.
      # Server-only. Must never be given a VITE_ prefix.
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      # Set to this service's own public URL once Render assigns it, so place
      # photo URLs are absolute and load inside the Android WebView.
      - key: PUBLIC_API_URL
        sync: false
      # Comma-separated browser origins allowed to call the API, for a
      # deployed web build. The Android WebView origins are always allowed.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: compass-db
          property: connectionString

databases:
  - name: compass-db
    plan: free
    databaseName: compass
    user: compass
